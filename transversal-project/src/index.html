          Filter Denied Claims

        <button onclick="runSearch()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded text-sm transition">
          Binary Search for Claim ID
        </button>
        <button onclick="runRates()" class="bg-amber-600 hover:bg-amber-700 text-white font-medium py-2 px-4 rounded text-sm transition">
          Calculate Denial Rates
        </button>
      </div>
    </div>
    
    <div>
