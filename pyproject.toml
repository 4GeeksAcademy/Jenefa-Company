[project]
name = "jenefa-company"
version = "0.0.0"
description = "HealthCore monorepo — run auth API unit tests from the repository root"
requires-python = ">=3.11"
dependencies = [
  "healthcore-api",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.uv.sources]
healthcore-api = { workspace = true }

[tool.uv.workspace]
members = ["services/api"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["services/api/app/auth"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
omit = [
  "*/app/auth/email.py",
  "*/app/auth/routers/*",
]
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "jenefajohn.me@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "libpass[bcrypt]>=1.9.3",
    "python-jose[cryptography]>=3.5.0",
]

[project.scripts]
jenefa-company = "jenefa_company:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
