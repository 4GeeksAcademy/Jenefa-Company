[project]
name = "jenefa-company"
version = "0.0.0"
description = "HealthCore monorepo — run auth API unit tests from the repository root"
requires-python = ">=3.11"
dependencies = [
  "healthcore-api",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.uv.sources]
healthcore-api = { workspace = true }

[tool.uv.workspace]
members = ["services/api"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["services/api/app/auth"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
omit = [
  "*/app/auth/email.py",
  "*/app/auth/routers/*",
]
