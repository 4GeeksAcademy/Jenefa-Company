<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthCore Application | Start Your Care Journey</title>
    <meta
      name="description"
      content="Apply to HealthCore and request your outpatient consultation with complete personal and medical intake details."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                100: "#ccfbf1",
                600: "#0d9488",
                700: "#0f766e",
                900: "#134e4a"
              }
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <header class="border-b border-slate-800 bg-slate-900/70">
      <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-brand-100 text-brand-900 font-bold">HC</span>
          <a href="index.html" class="font-semibold tracking-wide hover:text-brand-100 focus:outline-none focus:ring-2 focus:ring-brand-100 rounded">HealthCore</a>
        </div>
      
        <a href="index.html" class="text-sm text-slate-300 hover:text-white focus:outline-none focus:ring-2 focus:ring-brand-100 rounded">Back to homepage</a>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12" id="main-content">
      <section aria-labelledby="form-title" class="mb-8">
        <h1 id="form-title" class="text-3xl md:text-4xl font-bold">Patient Application Form</h1>
        <p class="mt-3 text-slate-300">
          Complete all fields so our patient access team can safely schedule your first consultation.
        </p>
      </section>

      <section class="rounded-3xl border border-slate-800 bg-slate-900/70 p-6 md:p-8">
        <form id="applicationForm" novalidate aria-describedby="form-status">
          <fieldset class="border border-slate-800 rounded-2xl p-4 md:p-5">
            <legend class="px-2 text-sm font-semibold text-brand-100">Patient and appointment details</legend>
            <div class="grid md:grid-cols-2 gap-5">
            <div>
              <label for="firstName" class="block text-sm font-medium">First name</label>
              <input id="firstName" name="firstName" type="text" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 focus:border-brand-600 focus:outline-none" required />
              <p class="mt-1 text-sm text-rose-300 hidden" id="firstNameError"></p>
            </div>

            <div>
              <label for="lastName" class="block text-sm font-medium">Last name</label>
              <input id="lastName" name="lastName" type="text" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 focus:border-brand-600 focus:outline-none" required />
              <p class="mt-1 text-sm text-rose-300 hidden" id="lastNameError"></p>
            </div>

            <div>
              <label for="email" class="block text-sm font-medium">Email address</label>
              <input id="email" name="email" type="email" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 focus:border-brand-600 focus:outline-none" required />
              <p class="mt-1 text-sm text-rose-300 hidden" id="emailError"></p>
            </div>

            <div>
              <label for="phone" class="block text-sm font-medium">Phone number</label>
              <input id="phone" name="phone" type="tel" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 focus:border-brand-600 focus:outline-none" required />
              <p class="mt-1 text-sm text-rose-300 hidden" id="phoneError"></p>
            </div>

            <div>
              <label for="country" class="block text-sm font-medium">Country</label>
              <select id="country" name="country" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 focus:border-brand-600 focus:outline-none" required>
                <option value="">Choose country</option>
                <option value="US">United States</option>
                <option value="UK">United Kingdom</option>
              </select>
              <p class="mt-1 text-sm text-rose-300 hidden" id="countryError"></p>
            </div>

            <div>
              <label for="clinicLocation" class="block text-sm font-medium">Preferred clinic location</label>
              <select id="clinicLocation" name="clinicLocation" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 focus:border-brand-600 focus:outline-none" required>
                <option value="">Select location</option>
                <option>Austin</option>
                <option>Houston</option>
                <option>Miami</option>
                <option>Atlanta</option>
                <option>London</option>
                <option>Manchester</option>
              </select>
              <p class="mt-1 text-sm text-rose-300 hidden" id="clinicLocationError"></p>
            </div>

            <div>
              <label for="service" class="block text-sm font-medium">Service needed</label>
              <select id="service" name="service" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 focus:border-brand-600 focus:outline-none" required>
                <option value="">Select service</option>
                <option>Primary Care</option>
                <option>Specialist Consultation</option>
                <option>Chronic Disease Management</option>
                <option>Preventive Programme</option>
              </select>
              <p class="mt-1 text-sm text-rose-300 hidden" id="serviceError"></p>
            </div>

            <div>
              <label for="insuranceType" class="block text-sm font-medium">Insurance / Payment type</label>
              <select id="insuranceType" name="insuranceType" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 focus:border-brand-600 focus:outline-none" required>
                <option value="">Select one</option>
                <option>Private Insurance</option>
                <option>Public Insurance / NHS</option>
                <option>Self-Pay</option>
              </select>
              <p class="mt-1 text-sm text-rose-300 hidden" id="insuranceTypeError"></p>
            </div>

            <div>
              <label for="preferredDate" class="block text-sm font-medium">Preferred appointment date</label>
              <div class="relative mt-2">
                <input id="preferredDate" name="preferredDate" type="date" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 pr-12 focus:border-brand-600 focus:outline-none" required />
                <button
                  type="button"
                  id="openDatePicker"
                  aria-label="Open calendar"
                  class="absolute inset-y-0 right-0 inline-flex items-center justify-center px-3 text-slate-300 hover:text-brand-100 focus:outline-none focus:ring-2 focus:ring-brand-100 rounded-r-xl"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                </button>
              </div>
              <p class="mt-1 text-sm text-rose-300 hidden" id="preferredDateError"></p>
            </div>

            <div>
              <label for="contactMethod" class="block text-sm font-medium">Preferred contact method</label>
              <select id="contactMethod" name="contactMethod" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 focus:border-brand-600 focus:outline-none" required>
                <option value="">Select contact method</option>
                <option>Email</option>
                <option>Phone call</option>
                <option>SMS</option>
              </select>
              <p class="mt-1 text-sm text-rose-300 hidden" id="contactMethodError"></p>
            </div>
            </div>
          </fieldset>

          <fieldset class="mt-5 border border-slate-800 rounded-2xl p-4 md:p-5">
            <legend class="px-2 text-sm font-semibold text-brand-100">Clinical information</legend>
            <div>
              <label for="healthSummary" class="block text-sm font-medium">Brief health summary</label>
              <textarea id="healthSummary" name="healthSummary" rows="4" class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 focus:border-brand-600 focus:outline-none" required></textarea>
              <p class="mt-1 text-sm text-rose-300 hidden" id="healthSummaryError"></p>
            </div>
          </fieldset>

          <fieldset class="mt-6 border border-slate-800 rounded-2xl p-4 md:p-5">
            <legend class="px-2 text-sm font-semibold text-brand-100">Consent and confirmation</legend>
            <div class="space-y-3">
              <label class="flex items-start gap-3">
                <input id="consentData" name="consentData" type="checkbox" class="mt-1 h-4 w-4 rounded border-slate-600 bg-slate-900 text-brand-600 focus:ring-brand-600" required />
                <span class="text-sm text-slate-200">I consent to HealthCore processing my data under HIPAA/UK GDPR for care coordination.</span>
              </label>
              <p class="text-sm text-rose-300 hidden" id="consentDataError"></p>

              <label class="flex items-start gap-3">
                <input id="nonEmergency" name="nonEmergency" type="checkbox" class="mt-1 h-4 w-4 rounded border-slate-600 bg-slate-900 text-brand-600 focus:ring-brand-600" required />
                <span class="text-sm text-slate-200">I confirm this request is not for a life-threatening emergency.</span>
              </label>
              <p class="text-sm text-rose-300 hidden" id="nonEmergencyError"></p>
            </div>
          </fieldset>

          <div id="form-status" class="mt-6" aria-live="polite"></div>

          <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center items-center">
            <button
              type="submit"
              class="inline-flex justify-center min-w-44 rounded-full bg-brand-600 px-6 py-3 font-semibold text-white hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-100"
            >
              Submit 
            </button>
            <button
              type="reset"
              class="inline-flex justify-center min-w-44 rounded-full bg-brand-600 px-6 py-3 font-semibold text-white hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-100"
            >
              Reset 
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="validation.js"></script>
  </body>
</html>
