[project]
name = "healthcore-api"
version = "1.1.0"
description = "HealthCore Unified API — incidents + JWT authentication"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "tinydb>=4.8.0",
  "pydantic[email]>=2.0",
  "python-jose[cryptography]>=3.5.0",
  "libpass[bcrypt]>=1.9.3",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["app.auth"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
omit = [
  # Thin HTTP wiring / third-party mail — business logic lives in service/security/deps.
  "app/auth/email.py",
  "app/auth/routers/*",
]
