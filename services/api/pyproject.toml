[project]
name = "healthcore-api"
version = "1.0.0"
description = "HealthCore Digital API — supplier directory and incident analysis"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "tinydb>=4.8.0",
    "pydantic>=2.0",
    "jinja2>=3.1.0",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "main",
    "models",
    "database",
    "seed",
    "constants",
]

[tool.setuptools.packages.find]
include = ["routes*", "app*"]
