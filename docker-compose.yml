services:
  ui:
    build:
      context: .
      dockerfile: uis/Dockerfile
    env_file:
      - .env
    environment:
      HC_API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /backend
      NEXT_PUBLIC_INCIDENT_API_URL: /backend
      NEXT_PUBLIC_INVENTORY_API_URL: /backend
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./:/workspace
      - ui_root_node_modules:/workspace/node_modules
      - ui_src_node_modules:/workspace/src/node_modules
      - ui_website_node_modules:/workspace/uis/website/node_modules
      - ui_web_node_modules:/workspace/uis/web/node_modules
    depends_on:
      - backend
    networks:
      - healthcore-network

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./services:/services
      - ./scripts:/scripts
    networks:
      - healthcore-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    networks:
      - healthcore-network

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: celery -A services.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./services:/services
      - ./scripts:/scripts
    depends_on:
      - redis
    networks:
      - healthcore-network

  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: celery -A services.celery_app flower --port=5555
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - healthcore-network

  # === ADDED QDRANT SERVICE VECTOR DATABASE ===
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: healthcore_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - healthcore-network
    restart: unless-stopped

networks:
  healthcore-network:
    name: healthcore-network

volumes:
  ui_root_node_modules:
  ui_src_node_modules:
  ui_website_node_modules:
  ui_web_node_modules:
  # === ADDED PERSISTENT VOLUME FOR VECTOR DATABASE DATA ===
  qdrant_data:
