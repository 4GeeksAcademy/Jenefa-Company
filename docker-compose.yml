# =============================================================================
# HealthCore Digital — Local Development Orchestration
# =============================================================================
# One command to boot the full stack for every engineer on every machine.
#
#   docker compose up --build
#
# Security (HIPAA / UK GDPR):
#   - Zero secrets, tokens, or medical metadata are hardcoded here.
#   - All environment variables are injected from the root .env file.
#   - .env is listed in .gitignore and must never be committed.
# =============================================================================

services:
  # ── Frontend ──────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: uis/Dockerfile
    env_file:
      - .env
    environment:
      # Internal Docker DNS — the UI proxy rewrites /backend/* to this URL.
      HC_API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /backend
      NEXT_PUBLIC_INCIDENT_API_URL: /backend
      NEXT_PUBLIC_INVENTORY_API_URL: /backend
    ports:
      - "3000:3000"   # Public-facing patient portal (website)
      - "3001:3001"   # Internal clinical / admin panel (web / backoffice)
    volumes:
      # Bind-mount the entire repo so code edits are instantly reflected.
      - ./:/workspace
      # Persist node_modules across container restarts (bind-mounts would
      # otherwise mask the image-installed node_modules).
      - ui_root_node_modules:/workspace/node_modules
      - ui_src_node_modules:/workspace/src/node_modules
      - ui_website_node_modules:/workspace/uis/website/node_modules
      - ui_web_node_modules:/workspace/uis/web/node_modules
    depends_on:
      - backend
    networks:
      - healthcore-network

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"   # FastAPI / Uvicorn
    volumes:
      # Bind-mount for hot-reload: code changes on the host instantly
      # propagate to the container so uvicorn --reload picks them up.
      - ./services:/services
      # The incident_core analysis scripts are shared across services.
      - ./scripts:/scripts
    networks:
      - healthcore-network

# ── Networking ──────────────────────────────────────────────────────────────
# Both services communicate over an explicitly named internal bridge network.
# The UI reaches the API via http://backend:8000 (Docker DNS), never via
# localhost or hardcoded IP addresses.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    networks:
      - healthcore-network

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: celery -A services.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./services:/services
      - ./scripts:/scripts
    depends_on:
      - redis
    networks:
      - healthcore-network

  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: celery -A services.celery_app flower --port=5555
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - healthcore-network

  # === ADDED QDRANT SERVICE VECTOR DATABASE ===
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: healthcore_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - healthcore-network
    restart: unless-stopped

networks:
  healthcore-network:
    name: healthcore-network
    driver: bridge

# ── Persistent volumes ─────────────────────────────────────────────────────
# Named volumes prevent bind-mounts from shadowing image-layer node_modules.
volumes:
  ui_root_node_modules:
  ui_src_node_modules:
  ui_website_node_modules:
  ui_web_node_modules:
  # === ADDED PERSISTENT VOLUME FOR VECTOR DATABASE DATA ===
  qdrant_data:
